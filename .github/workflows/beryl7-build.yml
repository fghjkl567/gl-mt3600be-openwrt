name: Beryl 7 firmware build

on:
  workflow_dispatch:
  push:
    branches:
      - beryl7-25.12.6-merged
    paths:
      - '.github/workflows/beryl7-build.yml'
      - 'target/**'
      - 'package/**'
      - 'include/**'
      - 'tools/**'
      - 'config/**'
      - 'scripts/**'

permissions:
  contents: read

concurrency:
  group: beryl7-build-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive

      - name: Fetch pinned Beryl 7 fan controller
        run: ./scripts/prepare-beryl7-fancontrol.sh

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             build-essential clang flex bison g++ gawk gcc-multilib g++-multilib             gettext git libncurses-dev libssl-dev python3 python3-setuptools             rsync swig unzip zlib1g-dev file wget jq

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure GL-MT3600BE
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_glinet_gl-mt3600be=y
          EOF
          make defconfig

      - name: Check shell scripts
        run: |
          set -eu
          sh -n scripts/prepare-beryl7-fancontrol.sh
          sh -n target/linux/mediatek/filogic/base-files/etc/hotplug.d/iface/99-gl-mt3600be-wan-eee
          sh -n target/linux/mediatek/filogic/base-files/etc/uci-defaults/13_gl-mt3600be-default-country
          sh -n package/luci-app-h5000m-fancontrol/root/usr/sbin/h5000m-fancontrol
          sh -n package/luci-app-h5000m-fancontrol/root/etc/init.d/h5000m-fancontrol

      - name: Build firmware
        run: |
          make -j"$(nproc)" V=s

      - name: Verify expected sysupgrade image
        run: |
          set -eu
          image="$(find bin/targets/mediatek/filogic -maxdepth 1 -type f -name '*gl-mt3600be*squashfs*sysupgrade*' -print -quit)"
          test -n "$image"
          sha256sum "$image" | tee bin/targets/mediatek/filogic/SHA256SUMS-beryl7
          echo "Built image: $image"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: beryl7-performance-${{ github.sha }}
          path: |
            bin/targets/mediatek/filogic/*gl-mt3600be*
            bin/targets/mediatek/filogic/SHA256SUMS-beryl7
          if-no-files-found: error
          retention-days: 14
